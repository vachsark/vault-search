name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
        numpy: [false]
        include:
          - python: "3.14"
            numpy: true
    name: py${{ matrix.python }}${{ matrix.numpy && ' + numpy' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.numpy
        run: pip install numpy python-igraph leidenalg
      - run: python -m unittest discover -s tests -v
